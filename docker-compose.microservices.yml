    volumes:
      - .:/app
    command: bun services/notification-service/src/index.ts
    environment:
      PORT: "4018"
      API_PREFIX: /api/v1
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
    ports:
      - "4018:4018"

  admin-service:
    image: oven/bun:1
    working_dir: /app
    volumes:
      - .:/app
    command: bun services/admin-service/src/index.ts
    environment:
      PORT: "4019"
      API_PREFIX: /api/v1
