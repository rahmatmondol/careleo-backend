# =============================================================
# CareLeo full stack — one API process.
#
#   careleo-backend (:3000)  ← the entire API
#     auth · pets · ai · tasks · vets · adoption · subscriptions ·
#     shop · social · video · media · freelancer
#   postgres (:5433) + redis (:6379)
#
# The filename still says "hybrid" for continuity with existing scripts and
# docs; there is nothing hybrid about it any more. It used to run seven
# containers — an api-gateway fanning out to shop / social / video / media /
# freelancer services plus this backend, each with its own database. All of
# them are modules of careleo-backend now, and the gateway went with them:
# this app already did its CORS and Swagger, and its rate limit moved into
# src/app.ts.
#
# Use docker-compose.yml instead for daily dev — it starts only Postgres and
# Redis, and you run `bun run dev` yourself.
#
# Migrating an existing stack:
#   1. docker compose -f docker-compose.hybrid.yml up -d careleo-postgres
#   2. bun run db:migrate                                  # creates the merged tables
#   3. bun run scripts/migrate-service-dbs.ts --orphans    # dry integrity check
#   4. bun run scripts/migrate-service-dbs.ts              # copy the data across
#   5. docker compose -f docker-compose.hybrid.yml up -d --remove-orphans
#
# `--remove-orphans` is what tears down the old gateway and service containers.
#
# The old careleo_shop / _social / _video / _media / _freelancer databases are
# left in place by that script. Drop them once you have verified the merged
# data and taken a backup — see docs/microservices/merge-into-monolith.md.
#
# ⚠️ Clients previously reached the gateway on host port 8090. That port is
# gone; everything talks to :3000 directly now.
# =============================================================

services:
  # ---------- Infrastructure ----------
  careleo-postgres:
    image: pgvector/pgvector:pg16
    container_name: careleo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: careleo
      POSTGRES_USER: careleo
      POSTGRES_PASSWORD: careleo_dev_password
    ports:
      - "5433:5432"
    volumes:
      - careleo_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careleo -d careleo"]
      interval: 5s
      timeout: 3s
      retries: 20

  careleo-redis:
    image: redis:7-alpine
    container_name: careleo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - careleo_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------- careleo-backend (the whole API) ----------
  careleo-backend:
    build: .
    container_name: careleo-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      API_PREFIX: /api/v1
      DATABASE_URL: postgresql://careleo:careleo_dev_password@careleo-postgres:5432/careleo
      REDIS_URL: redis://careleo-redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-super_secret_jwt_key_change_in_prod}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-super_secret_refresh_key_change_in_prod}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_GEMINI_API_KEY: ${GOOGLE_GEMINI_API_KEY:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
      # Moved here from the api-gateway.
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      # Media library (was media-service). Uploads are served back through
      # /api/v1/media/files/*, so the public base URL points at this service.
      MEDIA_STORAGE_DRIVER: local
      MEDIA_LOCAL_UPLOAD_DIR: /app/uploads/media
      MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-http://192.168.0.103:3000/api/v1/media/files}
      # Only still read by the legacy /shop/internal/* and /freelancer/internal/*
      # routes. Nothing in this repo sends it; remove once no old client does.
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET:-dev_internal_service_secret_change_me}
    ports:
      - "3000:3000"
    volumes:
      # Carried over from media-service so existing uploads survive the merge.
      - careleo_media_uploads:/app/uploads/media
    depends_on:
      careleo-postgres:
        condition: service_healthy
      careleo-redis:
        condition: service_healthy

volumes:
  careleo_pg_data:
  careleo_redis_data:
  careleo_media_uploads:
